name: Build Irisin

on:
  push:
    branches: [ "*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irisin-${{ github.workflow }}-${github.ref}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build:
    name: Build packages
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/irisin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Patch zh-Hans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          RULES = [('获取安装包', '下载安装包'), ('软件源', '插件源'),('软件包', '插件包'), ('软件', '插件'), ('队列变更', '任务列表')]
          def patch(t):
              for a, b in RULES:
                  t = t.replace(a, b)
              return t

          p = 'Irisin/Resources/Localizable.xcstrings'
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          n = 0
          for v in d['strings'].values():
              u = v.get('localizations', {}).get('zh-Hans', {}).get('stringUnit', {})
              old = u.get('value', '')
              new = patch(old)
              if new != old:
                  u['value'] = new
                  n += 1
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(f'xcstrings: {n} entries patched')

          p2 = 'Irisin/Resources/Settings.bundle/zh-Hans.lproj/Root.strings'
          s = open(p2, encoding='utf-8').read()
          open(p2, 'w', encoding='utf-8').write(patch(s))
          print('Root.strings patched' if patch(s) != s else 'Root.strings up-to-date')
          PY

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Compile
        run: make compile CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Package and verify both flavours
        run: make _packages CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/Packages
          shasum -a 256 ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irisin
          path: |
            build/Packages/*.deb
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Push deb packages to repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: irisin
          path: debs

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          repository: wwg135/wwg135.github.io
          token: ${{ secrets.DEPLOY_PAT }}
          path: website

      - name: Copy deb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/debs
          # 如果想每次只保留最新版本，打开下面这行注释，会清掉旧的 deb
          # rm -f website/debs/*.deb website/debs/SHA256SUMS
          cp debs/*.deb website/debs/
          ls -la website/debs/

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs/
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "chore: update irisin debs (${{ github.sha }})"
            git push
          fi
