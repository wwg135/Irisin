name: Build Irisin

on:
  push:
    branches: [ "*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irisin-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build:
    name: Build and verify Debian packages
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/irisin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Patch zh-Hans localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          def patch(text):
              if not isinstance(text, str):
                  return text
              text = text.replace('获取安装包', '下载安装包')
              text = text.replace('软件源', '插件源')
              text = text.replace('软件包', '插件包')
              text = text.replace('软件', '插件')
              return text

          # 1) Localizable.xcstrings（JSON String Catalog）
          xcstrings = 'Irisin/Resources/Localizable.xcstrings'
          with open(xcstrings, encoding='utf-8') as f:
              data = json.load(f)

          changed_xc = 0
          for val in data['strings'].values():
              loc = val.get('localizations', {})
              if 'zh-Hans' not in loc:
                  continue
              unit = loc['zh-Hans'].get('stringUnit', {})
              old = unit.get('value', '')
              new = patch(old)
              if new != old:
                  unit['value'] = new
                  changed_xc += 1

          with open(xcstrings, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(f'Patched {changed_xc} entries in Localizable.xcstrings')

          # 2) Settings.bundle zh-Hans Root.strings（纯文本，整体替换即可）
          root_strings = 'Irisin/Resources/Settings.bundle/zh-Hans.lproj/Root.strings'
          with open(root_strings, encoding='utf-8') as f:
              old_root = f.read()
          new_root = patch(old_root)
          if new_root != old_root:
              with open(root_strings, 'w', encoding='utf-8') as f:
                  f.write(new_root)
              print(f'Patched Root.strings')
          else:
              print('Root.strings already up to date')
          PY

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Compile
        run: make compile CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Package and verify both flavours
        run: make _packages CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/Packages
          shasum -a 256 ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Debian packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irisin
          path: |
            build/Packages/*.deb
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
#（注：内容由AI生成）
