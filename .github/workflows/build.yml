name: Build Irisin

on:
  push:
    branches: [ "*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irisin-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build:
    name: Build and verify Debian packages
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/irisin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Compile
        run: make compile CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Package and verify both flavours
        run: make _packages CONFIGURATION=Release DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/Packages
          shasum -a 256 ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Debian packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irisin
          path: |
            build/Packages/*.deb
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
